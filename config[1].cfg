# ============================================================
#  config.cfg — Health Monitor Configuration
#  Edit these values to match your environment
# ============================================================

# ---------- Thresholds (%) ----------
CPU_WARN=70          # Yellow warning level
CPU_CRITICAL=90      # Red alert level

MEM_WARN=75
MEM_CRITICAL=90

DISK_WARN=80
DISK_CRITICAL=90

# ---------- Disk mount to monitor ----------
DISK_MOUNT="/"       # Change to /data, /home, etc. if needed

# ---------- Network interface ----------
# Run `ip link` or `ifconfig` to find yours (e.g. eth0, ens33, enp0s3, wlan0)
NETWORK_INTERFACE="eth0"

# ---------- Services to watch ----------
# Comma-separated list of systemd service names or process names
# Examples: sshd, nginx, apache2, mysql, cron, docker
WATCHED_SERVICES="sshd, cron"

# ---------- Dashboard refresh rate ----------
REFRESH_INTERVAL=5   # seconds between refreshes in watch mode

# ---------- Email alerts (optional) ----------
ENABLE_EMAIL_ALERTS=false
ALERT_EMAIL="your@email.com"   # requires 'mail' or 'mailutils' installed
